<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flux</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <link rel="stylesheet" href="pdv.css" />

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="pdv.js" defer></script>
</head>
<body>

<div id="overlay-login" class="overlay-login">
    <div class="login-box">
        
        <h3 style="color: #fff; letter-spacing: 3px; font-size: 12px; margin-bottom: 30px; font-weight: 600;">AUTENTICAÇÃO</h3>
        
        <div class="login-input-row">
            <input type="password" id="input-pin" maxlength="4" placeholder="DIGITE O PIN" autocomplete="off">
            
            <button id="btn-entrar" onclick="fazerLogin()">
                <i class="fas fa-arrow-right"></i>
            </button>
        </div>

        <p id="msg-erro" class="msg-erro">PIN inválido. Tente novamente.</p>
    </div>
</div>


<header class="top-bar">
    <div class="store-name">
        <img src="imgs/Logo bc.webp" alt="Logo Newgene" class="logo-img">
    </div>
    
    <div class="system-info">

        <span>Caixa: <strong style="color: #2ecc71;">ABERTO</strong></span>

        <span style="margin: 0 0 0 20px">
            <i class="fas fa-user"></i> Operador(a): 
            <strong id="nome-operador-tela" style="color: #fff; margin-left: 5px;">--</strong>
        </span>

        <button onclick="fazerLogout()" title="Sair / Trocar Usuário" style="background: transparent; border: 1px solid #555; color: #fff; cursor: pointer; margin-left: 15px; padding: 5px 10px; border-radius: 4px;">
            <i class="fas fa-sign-out-alt"></i>
        </button>
    </div>
</header>

  <main class="main-container">
    
<section class="product-list-section">
      <div class="list-header">
        <div>Nº</div>
        <div>Código EAN</div>
        <div>Produto</div>
        <div style="text-align: center;">Quantidade</div>
        <div style="text-align: center;">Valor</div>
        <div style="text-align: center;">Total</div>
        <div style="text-align: center;"><i class="fas fa-trash"></i></div> </div>
      <div id="itens-carrinho" class="list-items-container"></div>
    </section>

    <aside class="sidebar-section">

      <div class="input-wrapper">
        <input id="search-pdv" type="text" class="product-input" placeholder="Buscar produto..." onkeyup="buscarProdutosPDV()" autofocus />
        <button class="btn-add-item" id="btn-buscar-manual">
            <i class="fas fa-search"></i>
        </button>
        <div id="lista-produtos-pdv" class="search-results-area"></div>
      </div>

      <div class="product-controls-container">
        <span class="stock-display">
            <i class="fas fa-boxes"></i> Estoque: <span id="spanEstoqueAtual">--</span>
        </span>

        <div class="controls-row">
            <div class="qty-buttons">
                <button class="btn-qty btn-minus" id="btnQtdMenos"><i class="fas fa-minus"></i></button>
                <input type="number" class="input-qty-control" id="txtQuantidade" value="1" min="1">
                <button class="btn-qty btn-plus" id="btnQtdMais"><i class="fas fa-plus"></i></button>
            </div>
            
            <input type="checkbox" id="chkVenderAlemEstoque" style="display: none;">

            <button id="btnToggleEstoque" class="btn-stock-lock">
                <i class="fas fa-lock"></i> ATIVAR OVERSELL
            </button>
      </div>

      <div class="customer-info">
        <i class="fas fa-user-tag"></i> Cliente: <strong>Consumidor Final</strong>
      </div>

      <div class="totals-area">
        <div class="grand-total">
            <span class="label">TOTAL:</span>
            <span class="value" id="total-carrinho">R$ 0,00</span>
        </div>
      </div>

      <div class="actions-grid">
         <button class="btn-mini btn-cancel" id="btn-cancelar-venda" title="Cancelar">
            <i class="fas fa-times"></i>Cancelar
         </button>
         
         <button class="btn-mini btn-discount" title="Desconto">
            <i class="fas fa-tag"></i>Desconto
         </button>

         <button class="btn-mini btn-consult" id="btn-consultar" title="Estoque">
             <i class="fas fa-search-plus"></i>Estoque
         </button>
         
         <button id="btn-finalizar" class="btn-finalize">
             FINALIZAR VENDA<i class="fas fa-check"></i>
         </button>
      </div>

    </aside>
  </main>
</body>
</html>
